[package]
name = "sg-bike-qr"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mongodb = "3"
pasetors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The Vercel Function. Vercel builds each `api/*.rs` as its own binary, and
# `vercel.json` sends every `/api/*` request to this one.
[[bin]]
name = "server"
path = "api/server.rs"

# The page and the API on a local port, for development: `cargo run --bin dev`.
[[bin]]
name = "dev"
path = "src/bin/dev.rs"

# Moves Firestore's export into MongoDB: `cargo run --bin import -- <file>`.
[[bin]]
name = "import"
path = "src/bin/import.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
