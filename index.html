<style>
/* ============================================================
   Aero design tokens (from aero-app-style.md)
   ============================================================ */
:root {
  --ink: #0B0B0B;      --ink-700: #26262A;  --ink-500: #52525B;  --ink-300: #A1A1AA;
  --action: #D85A30;   --action-700: #C24E27; --action-300: #ECA88F; --action-soft: #FDF3EF;
  --status: #2E6BE6;   --status-700: #1D4CA6; --status-300: #9DBAF7; --status-soft: #EFF4FE;
  --paper: #FCFCF9;    --surface: #FFFFFF;  --sunken: #FAFAF8;   --muted: #F4F4F5;
  --border: #E4E4E7;   --border-strong: #D4D4D8;
  --fg: #0B0B0B;       --fg-2: #52525B;     --fg-3: #71717A;
  --danger: #DC2626;   --danger-strong: #B91C1C; --danger-soft: #FEF2F2;
  --warning: #D97706;
  --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 16px; --r-xl: 24px;
  --shadow-xs: 0 1px 1px rgba(11,11,11,.04);
  --shadow-sm: 0 1px 0 0 rgba(11,11,11,.04), 0 2px 6px rgba(11,11,11,.05);
  --shadow-md: 0 1px 0 0 rgba(11,11,11,.04), 0 12px 24px -12px rgba(11,11,11,.10);
  --shadow-lg: 0 1px 0 0 rgba(11,11,11,.04), 0 24px 48px -24px rgba(11,11,11,.14);
  --shadow-focus: 0 0 0 3px rgba(216,90,48,.18);
  --sans: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* ============================================================
   Base & layout — mobile-first, full-viewport map
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--sans);
  color: var(--fg);
  background: var(--paper);
  -webkit-tap-highlight-color: transparent;
}
#map { position: fixed; inset: 0; z-index: 0; background: var(--paper); }

button { font: inherit; border: none; cursor: pointer; background: none; }
input  { font: inherit; }

/* ============================================================
   Top search bar
   ============================================================ */
#searchWrap {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: 12px; right: 12px;
  z-index: 1000;
}
#searchBox {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0 14px;
  height: 46px;
  box-shadow: var(--shadow-md);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
#searchBox:focus-within {
  border-color: var(--action);
  box-shadow: var(--shadow-focus);
}
#searchBox svg { flex: none; color: var(--fg-3); }
#searchInput {
  flex: 1; border: none; outline: none; background: none;
  font-size: 16px; /* 16px stops iOS zoom-on-focus */
  color: var(--fg);
  min-width: 0;
}
#searchInput::placeholder { color: var(--fg-3); }
#searchClear { flex: none; padding: 8px; color: var(--fg-3); display: none; }
#searchClear:hover { color: var(--fg); }
#searchResults {
  margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: none;
}
#searchResults .result {
  display: block; width: 100%; text-align: left;
  padding: 13px 16px;
  font-size: 14px;
  color: var(--fg);
  border-bottom: 1px solid var(--border);
  transition: background .15s var(--ease);
}
#searchResults .result:last-child { border-bottom: none; }
#searchResults .result:hover, #searchResults .result:active { background: var(--muted); }
#searchResults .result small { display: block; color: var(--fg-3); margin-top: 2px; font-size: 12px; }
#searchResults .none { padding: 13px 16px; color: var(--fg-3); font-size: 13.5px; }

/* ============================================================
   Floating buttons (locate + report FAB)
   ============================================================ */
#locateBtn {
  position: fixed;
  right: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  z-index: 1000;
  width: 46px; height: 46px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-2);
  transition: border-color .15s var(--ease), color .15s var(--ease);
}
#locateBtn:hover { border-color: var(--border-strong); color: var(--fg); }
#reportFab {
  position: fixed;
  right: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  z-index: 1000;
  height: 52px;
  border-radius: var(--r-md);
  padding: 0 20px 0 16px;
  background: var(--action);
  color: #fff;
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  box-shadow: var(--shadow-md);
  transition: background .15s var(--ease), transform .15s var(--ease);
}
#reportFab:hover { background: var(--action-700); }
#reportFab:active, #locateBtn:active { transform: scale(.97); }

/* ============================================================
   Report bottom sheet
   ============================================================ */
#sheetBackdrop {
  position: fixed; inset: 0; z-index: 1500;
  background: rgba(11,11,11,.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease);
}
#sheetBackdrop.open { opacity: 1; pointer-events: auto; }
#reportSheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1600;
  background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--shadow-lg);
  padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform: translateY(105%);
  transition: transform .25s var(--ease);
  max-height: 88vh;
  overflow-y: auto;
}
#reportSheet.open { transform: translateY(0); }
.sheetHandle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border-strong); margin: 6px auto 16px;
}
.eyebrow {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3);
}
#reportSheet h2 {
  font-size: 26px; line-height: .95; letter-spacing: -.04em; font-weight: 800;
  margin: 6px 0 6px;
}
#reportSheet .sub { color: var(--fg-2); font-size: 13.5px; margin-bottom: 18px; }

#cameraWrap {
  position: relative;
  border-radius: var(--r-lg); overflow: hidden;
  background: var(--ink);
  aspect-ratio: 4 / 3;
  margin-bottom: 16px;
  display: none;
}
#cameraWrap.on { display: block; }
#cameraVideo { width: 100%; height: 100%; object-fit: cover; }
#scanHint {
  position: absolute; left: 0; right: 0; bottom: 10px;
  text-align: center; color: #fff;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(11,11,11,.8);
}
#scanBox {
  position: absolute; top: 50%; left: 50%;
  width: 55%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.85);
  border-radius: var(--r-lg);
}

.field label {
  display: block;
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3);
  margin-bottom: 8px;
}
#codeInput {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-md);
  font-size: 20px;
  font-family: var(--mono);
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--fg);
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
#codeInput::placeholder { color: var(--fg-3); letter-spacing: 2px; }
#codeInput:focus { border-color: var(--action); box-shadow: var(--shadow-focus); }
#codeInput.bad { border-color: var(--danger); }
#codeInput.bad:focus { box-shadow: 0 0 0 3px rgba(220,38,38,.14); }
#codeError { color: var(--danger-strong); font-size: 12.5px; margin-top: 6px; min-height: 16px; }

#gpsStatus {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .02em;
  color: var(--fg-2);
  margin: 14px 0 18px;
}
#gpsDot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex: none; }
#gpsDot.ok { background: var(--status); box-shadow: 0 0 0 3px rgba(46,107,230,.16); }
#gpsDot.bad { background: var(--danger); }

#submitBtn {
  width: 100%;
  padding: 14px;
  border-radius: var(--r-md);
  background: var(--ink); color: #fff;
  font-size: 16px; font-weight: 600;
  transition: background .15s var(--ease), transform .15s var(--ease);
}
#submitBtn:hover:not(:disabled) { background: var(--ink-700); }
#submitBtn:disabled { background: var(--ink-300); cursor: default; }
#submitBtn:active:not(:disabled) { transform: scale(.99); }

/* ============================================================
   Banners & toasts
   ============================================================ */
#banner {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 68px);
  left: 12px; right: 12px;
  z-index: 900;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--fg-2);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  padding: 11px 14px;
  font-size: 13px;
  display: none;
  align-items: center; gap: 10px;
}
#banner.show { display: flex; }
#banner button { color: var(--action); font-weight: 600; flex: none; padding: 4px; }
#banner button:hover { color: var(--action-700); }

#toasts {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  z-index: 2000;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 11px 18px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  max-width: 86vw;
  text-align: center;
  box-shadow: var(--shadow-md);
  animation: toastIn .22s var(--ease);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ============================================================
   Map markers & popups
   ============================================================ */
.codePin {
  background: var(--ink);
  color: #fff;
  font-family: var(--mono);
  font-size: 11px; font-weight: 500; letter-spacing: .08em;
  padding: 4px 8px;
  border-radius: var(--r-xs);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  position: relative;
  width: max-content;
  transform: translate(-50%, -100%);
}
.codePin::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -5px;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--ink);
  border-bottom: none;
}
.leaflet-popup-content-wrapper { border-radius: var(--r-lg); box-shadow: var(--shadow-lg); }
.leaflet-popup-content { margin: 14px 16px; font-family: var(--sans); }
.popupCode {
  font-family: var(--mono);
  font-size: 20px; font-weight: 700;
  letter-spacing: 1px;
  color: var(--fg);
}
.popupMeta {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--fg-3);
  margin: 6px 0 12px;
  font-variant-numeric: tabular-nums;
}
.popupLinks { display: flex; gap: 8px; }
.popupLinks a {
  flex: 1;
  text-align: center;
  padding: 9px 12px;
  border-radius: var(--r-md);
  background: var(--action-soft);
  border: 1px solid var(--action-300);
  color: var(--action-700);
  font-size: 13px; font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  transition: background .15s var(--ease);
}
.popupLinks a:hover { background: #FBE9E1; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="searchWrap">
  <div id="searchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Search a place in Singapore" autocomplete="off" enterkeyhint="search">
    <button id="searchClear" aria-label="Clear search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="searchResults"></div>
</div>

<div id="banner"><span id="bannerText"></span><button id="bannerAction"></button></div>

<button id="locateBtn" aria-label="Center on my location">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg>
</button>

<button id="reportFab">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
  Report a code
</button>

<div id="sheetBackdrop"></div>
<div id="reportSheet" role="dialog" aria-label="Report a QR code">
  <div class="sheetHandle"></div>
  <div class="eyebrow">New report</div>
  <h2>Report a QR code</h2>
  <p class="sub">Stand next to the parking QR sticker, then scan or type its code.</p>

  <div id="cameraWrap">
    <video id="cameraVideo" playsinline muted></video>
    <div id="scanBox"></div>
    <div id="scanHint">Point the camera at the QR sticker</div>
  </div>

  <div class="field">
    <label for="codeInput">Code on the sticker</label>
    <input id="codeInput" placeholder="ABC-1234" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8">
    <div id="codeError"></div>
  </div>

  <div id="gpsStatus"><span id="gpsDot"></span><span id="gpsText">Waiting for GPS…</span></div>

  <button id="submitBtn" disabled>Submit report</button>
</div>

<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/aero-db.js"></script>
<script>
'use strict';
/* ============================================================
   Section 1 — Config & constants
   ============================================================ */
const CODE_RE = /^[A-Z]{3}-[0-9A-Z]{4}$/;
// Loose variant used to pull a code out of scanned QR payloads (which may
// be a URL containing the code) and to auto-insert the dash while typing.
const CODE_ANYWHERE_RE = /[A-Z]{3}-?[0-9A-Z]{4}/;
const SG_CENTER = [1.3521, 103.8198];
const SG_BBOX = { minLat: 1.15, maxLat: 1.48, minLng: 103.6, maxLng: 104.1 };
const MAX_ACCURACY_M = 100;      // reject fixes worse than this at submit
const MIN_RADIUS_M = 250;        // near-query radius clamp (viewport-derived)
const MAX_RADIUS_M = 50000;      // server cap
const NEAR_LIMIT = 50;
const POLL_MS = 10000;
const MOVE_DEBOUNCE_MS = 500;
const SEARCH_DEBOUNCE_MS = 600;
// Nominatim asks for an identifying contact on heavy use. Set before launch
// or leave blank for light usage. See refs/PLAN.md.
const NOMINATIM_EMAIL = '';

/* ============================================================
   Section 2 — aeroDB access layer (real when hosted, mock otherwise)
   ============================================================ */
// The in-memory mock mirrors the aero-db.js Table surface (add/get/set/
// patch/list incl. `near` with _distanceMeters and nearest-first ordering)
// so the whole app can be exercised locally before the page is published.
function makeMockDb() {
  const store = {}; // table -> Map(id -> row)
  let autoId = 1;
  const seed = [
    { code: 'ABC-1234', lat: 1.28409, lng: 103.85148, numReports: 4, lastReportAt: Date.now() - 3600e3 },
    { code: 'DEF-9B2K', lat: 1.28311, lng: 103.85302, numReports: 2, lastReportAt: Date.now() - 86400e3 },
    { code: 'GHI-77XQ', lat: 1.28672, lng: 103.85455, numReports: 9, lastReportAt: Date.now() - 7200e3 },
    { code: 'JKL-3C41', lat: 1.28150, lng: 103.86020, numReports: 1, lastReportAt: Date.now() - 5 * 86400e3 },
  ];
  function tbl(name) {
    if (!store[name]) store[name] = new Map();
    return store[name];
  }
  seed.forEach(s => tbl('qr_locations').set(s.code, {
    id: s.code, data: s, createTime: '', updateTime: '',
  }));
  return {
    mock: true,
    table(name) {
      const t = tbl(name);
      return {
        async add(data) {
          const id = 'mock-' + autoId++;
          const row = { id, data: { ...data, _owner: 'mock' }, createTime: '', updateTime: '' };
          t.set(id, row);
          return row;
        },
        async get(id) { return t.get(id) || null; },
        async set(id, data) {
          const row = { id, data: { ...data }, createTime: '', updateTime: '' };
          t.set(id, row);
          return row;
        },
        async patch(id, data) {
          const row = t.get(id);
          if (!row) { const e = new Error('not_found'); e.status = 404; throw e; }
          Object.assign(row.data, data);
          return row;
        },
        async delete(id) { t.delete(id); return { ok: true }; },
        async list(opts = {}) {
          let rows = [...t.values()];
          if (opts.eq) {
            rows = rows.filter(r => Object.entries(opts.eq).every(([k, v]) => r.data[k] === v));
          }
          if (opts.near) {
            const { lat, lng, radiusMeters } = opts.near;
            rows = rows
              .map(r => ({ ...r, _distanceMeters: haversineM(lat, lng, r.data.lat, r.data.lng) }))
              .filter(r => r._distanceMeters <= radiusMeters)
              .sort((a, b) => a._distanceMeters - b._distanceMeters);
          }
          const off = opts.offset || 0;
          return rows.slice(off, off + (opts.limit || 50));
        },
      };
    },
    async whoami() { return { kind: 'guest', id: 'mock' }; },
  };
}

let db, localMode = false;
try {
  db = AeroDB.current(); // throws off /p/... URLs; ReferenceError when /aero-db.js didn't load
} catch (_) {
  db = makeMockDb();
  localMode = true;
}

// --- login gate (soft): search & report require a signed-in aero user.
// This is UI-level gating only — the data-layer tables stay own/any since
// aeroDB has no "authenticated users only" access tier.
let whoKind = null; // 'user' | 'guest' | null = not yet resolved
async function ensureWho() {
  if (whoKind === null) {
    try { whoKind = (await db.whoami()).kind; } catch (_) { whoKind = 'guest'; }
  }
  return whoKind;
}
async function requireLogin() {
  if (localMode) return true; // preview mode: nothing to sign in to
  if (await ensureWho() === 'user') return true;
  toast('Sign in with your aero account to continue…');
  setTimeout(() => {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
  }, 800);
  return false;
}
const scansTable = () => db.table('qr_scans');
const locationsTable = () => db.table('qr_locations');

/* ============================================================
   Section 3 — Math & validation utils
   ============================================================ */
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function median(nums) {
  const s = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function normalizeCode(raw) {
  let v = (raw || '').trim().toUpperCase();
  // Accept a missing dash ("ABC1234") and codes embedded in URLs/QR payloads.
  const m = v.match(CODE_ANYWHERE_RE);
  if (!m) return null;
  v = m[0].includes('-') ? m[0] : m[0].slice(0, 3) + '-' + m[0].slice(3);
  return CODE_RE.test(v) ? v : null;
}
function inSingapore(lat, lng) {
  return lat >= SG_BBOX.minLat && lat <= SG_BBOX.maxLat &&
         lng >= SG_BBOX.minLng && lng <= SG_BBOX.maxLng;
}
function timeAgo(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' days ago';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/* ============================================================
   Section 4 — Data layer
   ============================================================ */
async function fetchNearby(lat, lng, radiusMeters) {
  return locationsTable().list({
    near: { lat, lng, radiusMeters: Math.min(Math.max(radiusMeters, MIN_RADIUS_M), MAX_RADIUS_M) },
    limit: NEAR_LIMIT,
  });
}

// Recompute the component-wise median over every raw scan of this code and
// upsert the shared per-code row (row id = the code itself; PUT-on-missing
// creates it for anyone because qr_locations is write:'any').
async function recomputeAndUpsertLocation(code) {
  const rows = [];
  let offset = 0;
  for (;;) {
    const page = await scansTable().list({ eq: { code }, limit: 200, offset });
    rows.push(...page);
    offset += 200;
    if (page.length < 200 || offset > 10000) break;
  }
  const loc = {
    code,
    lat: median(rows.map(r => r.data.lat)),
    lng: median(rows.map(r => r.data.lng)),
    numReports: rows.length,
    lastReportAt: Date.now(),
  };
  await locationsTable().set(code, loc);
  return loc;
}

async function submitScan(code, pos, source) {
  await scansTable().add({
    code,
    lat: pos.lat,
    lng: pos.lng,
    accuracy: pos.accuracy,
    source,
    clientTimestamp: Date.now(),
  });
  return recomputeAndUpsertLocation(code);
}

/* ============================================================
   Section 5 — Map layer
   ============================================================ */
const map = L.map('map', { zoomControl: false, attributionControl: true })
  .setView(SG_CENTER, 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const markers = new Map(); // code -> L.Marker
let userMarker = null, userAccCircle = null;
let partialNoticeShown = false;

function popupHtml(code, data, distanceMeters) {
  const dist = distanceMeters != null && isFinite(distanceMeters)
    ? Math.round(distanceMeters) + ' m away · ' : '';
  return `
    <div class="popupCode">${esc(code)}</div>
    <div class="popupMeta">${dist}${data.numReports} report${data.numReports === 1 ? '' : 's'} · ${timeAgo(data.lastReportAt)}</div>
    <div class="popupLinks">
      <a href="https://www.google.com/maps/search/?api=1&query=${data.lat},${data.lng}" target="_blank" rel="noopener">Google Maps</a>
      <a href="https://maps.apple.com/?daddr=${data.lat},${data.lng}" target="_blank" rel="noopener">Apple Maps</a>
    </div>`;
}

function upsertMarker(code, data, distanceMeters) {
  const existing = markers.get(code);
  if (existing) {
    existing.setLatLng([data.lat, data.lng]);
    existing.setPopupContent(popupHtml(code, data, distanceMeters));
    return;
  }
  const icon = L.divIcon({ className: '', html: `<div class="codePin">${esc(code)}</div>`, iconSize: [0, 0] });
  const m = L.marker([data.lat, data.lng], { icon }).addTo(map);
  m.bindPopup(popupHtml(code, data, distanceMeters));
  markers.set(code, m);
}

function renderRows(rows) {
  const seen = new Set();
  for (const r of rows) {
    upsertMarker(r.data.code, r.data, r._distanceMeters);
    seen.add(r.data.code);
  }
  // Drop markers that fell out of the current query's radius/limit.
  for (const [code, m] of markers) {
    if (!seen.has(code)) { map.removeLayer(m); markers.delete(code); }
  }
  if (rows.partial && !partialNoticeShown) {
    partialNoticeShown = true; // once per session is enough
    toast('Busy area — some codes may be missing. Zoom in for full results.');
  }
}

function viewportRadiusM() {
  const b = map.getBounds(), c = map.getCenter(), ne = b.getNorthEast();
  return haversineM(c.lat, c.lng, ne.lat, ne.lng);
}

let refreshTimer = null, refreshing = false;
async function refreshNearby() {
  if (refreshing) return;
  refreshing = true;
  try {
    const c = map.getCenter();
    renderRows(await fetchNearby(c.lat, c.lng, viewportRadiusM()));
  } catch (e) {
    if (e.status === 400 && e.body && e.body.error === 'geo_not_enabled') {
      showBanner('Database not set up yet (geo flag missing on qr_locations).', '', null);
    } else {
      console.warn('refreshNearby failed:', e);
    }
  } finally {
    refreshing = false;
  }
}
map.on('moveend', () => {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshNearby, MOVE_DEBOUNCE_MS);
});
setInterval(() => { if (document.visibilityState === 'visible') refreshNearby(); }, POLL_MS);

function showUserDot(lat, lng, accuracy) {
  if (!userMarker) {
    userMarker = L.circleMarker([lat, lng], {
      radius: 7, color: '#fff', weight: 2.5, fillColor: '#2E6BE6', fillOpacity: 1,
    }).addTo(map);
    userAccCircle = L.circle([lat, lng], {
      radius: accuracy, color: '#2E6BE6', weight: 1, opacity: .3, fillOpacity: .08,
    }).addTo(map);
  } else {
    userMarker.setLatLng([lat, lng]);
    userAccCircle.setLatLng([lat, lng]).setRadius(accuracy);
  }
}

/* ============================================================
   Section 6 — Place search (OSM Nominatim, debounced + cached)
   ============================================================ */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchClear = document.getElementById('searchClear');
const searchCache = new Map();
let searchTimer = null, searchBusy = false;

async function doSearch(q) {
  const key = q.toLowerCase();
  if (searchCache.has(key)) return renderSearch(searchCache.get(key));
  if (searchBusy) return; // ≤1 in-flight request (Nominatim policy)
  searchBusy = true;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=sg'
      + '&q=' + encodeURIComponent(q)
      + (NOMINATIM_EMAIL ? '&email=' + encodeURIComponent(NOMINATIM_EMAIL) : '');
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('nominatim ' + res.status);
    const results = await res.json();
    searchCache.set(key, results);
    if (searchInput.value.trim().toLowerCase() === key) renderSearch(results);
  } catch (e) {
    console.warn('search failed:', e);
    searchResults.innerHTML = '<div class="none">Search unavailable — try again.</div>';
    searchResults.style.display = 'block';
  } finally {
    searchBusy = false;
  }
}

function renderSearch(results) {
  if (!results.length) {
    searchResults.innerHTML = '<div class="none">No places found.</div>';
  } else {
    searchResults.innerHTML = results.map((r, i) => {
      const [name, ...rest] = r.display_name.split(', ');
      return `<button class="result" data-i="${i}">${esc(name)}<small>${esc(rest.slice(0, 3).join(', '))}</small></button>`;
    }).join('');
    searchResults.querySelectorAll('.result').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = results[+btn.dataset.i];
        map.setView([+r.lat, +r.lon], 17);
        closeSearch();
      });
    });
  }
  searchResults.style.display = 'block';
}

function closeSearch() {
  searchResults.style.display = 'none';
  searchInput.blur();
}
searchInput.addEventListener('focus', async () => {
  if (localMode) return;
  if (await ensureWho() !== 'user') {
    searchInput.blur();
    requireLogin();
  }
});
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  clearTimeout(searchTimer);
  if (q.length < 3) { searchResults.style.display = 'none'; return; }
  searchTimer = setTimeout(() => doSearch(q), SEARCH_DEBOUNCE_MS);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  closeSearch();
});
map.on('mousedown touchstart', closeSearch);

/* ============================================================
   Section 7 — Report flow (camera scan + always-available manual entry)
   ============================================================ */
const sheet = document.getElementById('reportSheet');
const backdrop = document.getElementById('sheetBackdrop');
const cameraWrap = document.getElementById('cameraWrap');
const video = document.getElementById('cameraVideo');
const codeInput = document.getElementById('codeInput');
const codeError = document.getElementById('codeError');
const submitBtn = document.getElementById('submitBtn');
const gpsDot = document.getElementById('gpsDot');
const gpsText = document.getElementById('gpsText');

let cameraStream = null, scanTimer = null, gpsWatchId = null, lastFix = null;
let codeSource = 'manual'; // flipped to 'scan' when the detector fills the field

async function startCamera() {
  if (!('BarcodeDetector' in window)) return;
  let formats;
  try { formats = await BarcodeDetector.getSupportedFormats(); } catch (_) { return; }
  if (!formats.includes('qr_code')) return;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (_) {
    toast('Camera not available — enter the code manually.');
    return;
  }
  video.srcObject = cameraStream;
  await video.play().catch(() => {});
  cameraWrap.classList.add('on');
  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  scanTimer = setInterval(async () => {
    if (video.readyState < 2) return;
    try {
      const found = await detector.detect(video);
      for (const b of found) {
        const code = normalizeCode(b.rawValue);
        if (code) {
          codeInput.value = code; // populate, don't submit — user confirms
          codeSource = 'scan';
          validateCodeField();
          stopCamera();
          toast('Code detected — check it and submit.');
          return;
        }
      }
    } catch (_) { /* transient detect failures are fine */ }
  }, 400);
}

function stopCamera() {
  clearInterval(scanTimer); scanTimer = null;
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  video.srcObject = null;
  cameraWrap.classList.remove('on');
}

function startGpsWatch() {
  if (!navigator.geolocation) { gpsText.textContent = 'No GPS on this device.'; return; }
  gpsWatchId = navigator.geolocation.watchPosition(p => {
    lastFix = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy };
    const acc = Math.round(lastFix.accuracy);
    if (!inSingapore(lastFix.lat, lastFix.lng)) {
      gpsDot.className = 'bad';
      gpsText.textContent = 'Location is outside Singapore.';
    } else if (lastFix.accuracy > MAX_ACCURACY_M) {
      gpsDot.className = 'bad';
      gpsText.textContent = `GPS ±${acc} m — too imprecise, move to an open area.`;
    } else {
      gpsDot.className = 'ok';
      gpsText.textContent = `GPS locked · ±${acc} m`;
    }
    validateCodeField();
  }, () => {
    gpsDot.className = 'bad';
    gpsText.textContent = 'Location permission denied — enable it to report.';
  }, { enableHighAccuracy: true, maximumAge: 5000 });
}

function stopGpsWatch() {
  if (gpsWatchId != null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
}

function fixIsSubmittable() {
  return lastFix && lastFix.accuracy <= MAX_ACCURACY_M && inSingapore(lastFix.lat, lastFix.lng);
}

function validateCodeField() {
  const raw = codeInput.value.trim();
  const code = normalizeCode(raw);
  if (raw && !code) {
    codeInput.classList.add('bad');
    codeError.textContent = 'Format: 3 letters + 4 characters — e.g. ABC-1234';
  } else {
    codeInput.classList.remove('bad');
    codeError.textContent = '';
  }
  submitBtn.disabled = !(code && fixIsSubmittable());
  return code;
}
codeInput.addEventListener('input', () => {
  // Input mask: uppercase and auto-insert the dash — the user never types it.
  const clean = codeInput.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 7);
  codeInput.value = clean.length > 3 ? clean.slice(0, 3) + '-' + clean.slice(3) : clean;
  codeSource = 'manual';
  validateCodeField();
});

function openSheet() {
  sheet.classList.add('open');
  backdrop.classList.add('open');
  lastFix = null;
  codeSource = 'manual';
  gpsDot.className = '';
  gpsText.textContent = 'Waiting for GPS…';
  startGpsWatch();
  startCamera();
}

function closeSheet() {
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  stopCamera();
  stopGpsWatch();
}

document.getElementById('reportFab').addEventListener('click', async () => {
  if (await requireLogin()) openSheet();
});
backdrop.addEventListener('click', closeSheet);

submitBtn.addEventListener('click', async () => {
  const code = validateCodeField();
  if (!code || !fixIsSubmittable()) return;
  const source = codeSource;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  try {
    const loc = await submitScan(code, lastFix, source);
    upsertMarker(code, loc, haversineM(lastFix.lat, lastFix.lng, loc.lat, loc.lng));
    closeSheet();
    codeInput.value = '';
    toast(localMode
      ? 'Saved locally (preview mode — not persisted).'
      : 'Thanks — code reported!');
    map.setView([loc.lat, loc.lng], Math.max(map.getZoom(), 17));
  } catch (e) {
    if (e.status === 401 || e.status === 403) {
      toast('Reporting is not open yet — tables need to be configured.');
    } else {
      toast('Submit failed: ' + (e.message || 'unknown error'));
    }
  } finally {
    submitBtn.textContent = 'Submit report';
    validateCodeField();
  }
});

/* ============================================================
   Section 8 — Banners, toasts & app init
   ============================================================ */
const banner = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');
const bannerAction = document.getElementById('bannerAction');
let bannerCb = null;

function showBanner(text, actionLabel, cb) {
  bannerText.textContent = text;
  bannerAction.textContent = actionLabel || '';
  bannerAction.style.display = actionLabel ? 'block' : 'none';
  bannerCb = cb;
  banner.classList.add('show');
}
function hideBanner() { banner.classList.remove('show'); bannerCb = null; }
bannerAction.addEventListener('click', () => { if (bannerCb) bannerCb(); });

function toast(msg, ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function locateAndCenter(showErrors) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    hideBanner();
    const { latitude: lat, longitude: lng, accuracy } = p.coords;
    showUserDot(lat, lng, accuracy);
    map.setView([lat, lng], 17);
  }, () => {
    if (showErrors) {
      showBanner('Enable location to see codes near you.', 'Retry', () => locateAndCenter(true));
    }
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}

document.getElementById('locateBtn').addEventListener('click', () => locateAndCenter(true));

// --- init ---
if (localMode) {
  showBanner('Local preview mode — data won’t be saved. Publish on aero to go live.', '', null);
} else {
  ensureWho(); // resolve the visitor's kind early so the first gated tap is instant
}
locateAndCenter(true);
refreshNearby();
</script>
</body>
</html>
